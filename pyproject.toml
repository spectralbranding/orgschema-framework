[project]
name = "orgschema-framework"
version = "0.1.0"
description = "Schema validator for Organizational Schema Theory reverse-design TDD specifications"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
orgschema-validate = "orgschema_framework.validate:main"
orgschema-query = "orgschema_framework.query:main"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.0",
    "mypy>=1.8",
    "pytest>=7.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.pytest.ini_options]
# The project is consumed as a source tree (no build-system); add the repo
# root to sys.path so tests can import the orgschema_framework package the
# same way `python -m orgschema_framework.validate` resolves it.
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
